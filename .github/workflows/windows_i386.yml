name: Windows i386

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-windows-i386:
    name: Windows i386 tests (Nim version-2-2)
    runs-on: windows-latest
    # `nimble test` builds and runs the suite in four configurations; a single
    # one already takes ~10 minutes on a runner.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Same llvm-mingw release as nimbus-common-workflow uses for the
      # windows-amd64 job; keep the two in sync when bumping.
      - name: Restore llvm-mingw (i686) from cache
        id: windows-mingw-cache
        uses: actions/cache@v4
        with:
          path: external/mingw-i386
          key: mingw-llvm-20-i386

      - name: Install llvm-mingw (i686)
        if: steps.windows-mingw-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p external
          MINGW_BASE="https://github.com/mstorsjo/llvm-mingw/releases/download/20250709"
          curl -L "$MINGW_BASE/llvm-mingw-20250709-ucrt-i686.zip" -o external/mingw-i386.zip
          7z x -y external/mingw-i386.zip -oexternal/mingw-i386/
          mv external/mingw-i386/**/* ./external/mingw-i386

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run tests
        shell: bash
        env:
          NIM_TEST_SUCCESS_MARKER: build/i386-tests-passed
        run: |
          mingw_bin="$(cd external/mingw-i386/bin && pwd -W)"
          export NIMFLAGS="--cpu:i386 --cc:gcc --gcc.path:${mingw_bin}"
          # `nimble test` can report a failing task and still exit 0, so rely on
          # the marker, which the task writes only after every configuration ran.
          rm -f "$NIM_TEST_SUCCESS_MARKER"
          nimble test
          test -f "$NIM_TEST_SUCCESS_MARKER"
