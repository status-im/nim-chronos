name: Windows i386

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-windows-i386:
    name: Windows i386 tests (Nim version-2-2)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore MinGW-W64 (i686) from cache
        id: mingw32-cache
        uses: actions/cache@v4
        with:
          path: external/mingw32
          key: mingw32-i686-posix-dwarf-11.1.0

      - name: Install MinGW-W64 (i686)
        if: steps.mingw32-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p external
          curl -L -o external/mingw32.7z \
            https://github.com/brechtsanders/winlibs_mingw/releases/download/11.1.0-12.0.0-9.0.0-r2/winlibs-i686-posix-dwarf-gcc-11.1.0-mingw-w64-9.0.0-r2.7z
          7z x -y external/mingw32.7z -oexternal/

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run tests
        shell: bash
        env:
          NIM_TEST_SUCCESS_MARKER: build/i386-tests-passed
        run: |
          mingw32_bin="$(cd external/mingw32/bin && pwd -W)"
          export NIMFLAGS="--cpu:i386 --cc:gcc --gcc.path:${mingw32_bin}"
          # `nimble test` can report a failing task and still exit 0, so rely on
          # the marker, which the task writes only after every configuration ran.
          rm -f "$NIM_TEST_SUCCESS_MARKER"
          nimble test
          test -f "$NIM_TEST_SUCCESS_MARKER"
