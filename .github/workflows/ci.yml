name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@main
    with:
      test-command: |
        nimble install -y libbacktrace
        nimble test_asan
        nimble test
        nimble test_libbacktrace
        nimble examples
        nimble api_docs
